name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      FORMPLATFORM_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=FormPlatform!Ci2026;Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "FormPlatform!Ci2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FormPlatform!Ci2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FormPlatform.slnx
      - name: Build
        run: dotnet build FormPlatform.slnx --no-restore -m:1
      - name: Test
        run: dotnet test FormPlatform.slnx --no-build -m:1
